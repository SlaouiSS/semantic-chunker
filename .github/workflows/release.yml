name: Release

# Manual only — this never runs automatically. It is ready to use once the
# secrets below and the "release" environment are configured; until then it is
# inert. It drives the release profile defined in the parent POM (Phase R1); it
# does not define any release behaviour of its own.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and validate the release without publishing"
        type: boolean
        default: true

permissions:
  contents: read

# Never run two releases at once, and never cancel one in flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected environment lets maintainers require manual approval and scope
    # the release secrets to this workflow only.
    environment: release

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          # Writes a settings.xml server 'central' whose credentials come from the
          # env vars below, and imports the signing key for the maven-gpg-plugin.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Publish
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            ./mvnw --batch-mode --no-transfer-progress -Prelease -Dgpg.skip=true verify
          else
            ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
          fi

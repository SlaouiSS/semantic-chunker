name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the build only reads the repository. No token can write.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes; a PR push
# supersedes its own earlier runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & verify (${{ matrix.os }}, JDK 21)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Report every platform's result rather than cancelling siblings on the
      # first failure — better signal when a failure is platform-specific.
      fail-fast: false
      matrix:
        # Linux is the primary runner. Windows is included because the code does
        # platform-sensitive work (temp files via PDFBox/POI, multipart and line
        # endings, an in-JVM HTTP mock) and the project is developed on Windows;
        # .gitattributes pins eol=lf so the formatting gate behaves identically.
        # macOS is intentionally omitted: it is POSIX like Linux, so it adds
        # cost without covering a distinct failure mode.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # bash runs on all runners (Git Bash on Windows), so one command works
      # everywhere and the Unix wrapper is used uniformly.
      - name: Build and verify
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Surefire reports make an intermittent failure (e.g. the concurrency or
      # HTTP-mock tests) diagnosable without re-running locally.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/target/surefire-reports/**"
          retention-days: 7
          if-no-files-found: ignore
